version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - java
    groups:
      maven-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
