name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven and Docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate shell scripts
        run: |
          find scripts labs/01-loom-vs-reactive-checkout/scripts \
            -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Validate evidence tooling
        run: ./scripts/verify-evidence-tooling.sh

      - name: Run complete verification
        run: ./scripts/verify-all.sh

      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          docker compose -f labs/01-loom-vs-reactive-checkout/docker-compose.yml ps || true
          docker compose -f labs/01-loom-vs-reactive-checkout/docker-compose.yml logs --no-color || true

      - name: Cleanup
        if: always()
        run: docker compose -f labs/01-loom-vs-reactive-checkout/docker-compose.yml down --remove-orphans || true
